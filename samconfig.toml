# Configuración común de AWS SAM. Los parámetros de cada ambiente (subredes,
# user pool, etc.) no van aquí: el despliegue los pasa con
# --parameter-overrides desde las variables de GitHub (docs/despliegue.md).
version = 0.1

[default.global.parameters]
stack_name = "mincome-backend"

[default.build.parameters]
# Construye en el repo, sin copiar node_modules a una carpeta temporal.
build_in_source = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
resolve_s3 = true
s3_prefix = "mincome-backend"
