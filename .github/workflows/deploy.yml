name: Deploy

# Manual por ahora. Para desplegar en cada merge a main, agrega
# `push: { branches: [main] }`; el ambiente `production` sigue pidiendo
# aprobación si se la configuran.
on:
  workflow_dispatch:

permissions:
  contents: read
  # OIDC: GitHub entrega un token de corta duración y AWS lo cambia por el rol
  # de AWS_DEPLOY_ROLE_ARN. No hay llaves de AWS en el repositorio.
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      STACK_NAME: mincome-backend
      AWS_REGION: ${{ vars.AWS_REGION }}
      # Variables del ambiente `production` en GitHub (docs/despliegue.md).
      # Van por env y no dentro de `run:` para que no se interpreten como shell.
      PRIVATE_SUBNET_IDS: ${{ vars.PRIVATE_SUBNET_IDS }}
      LAMBDA_SECURITY_GROUP_ID: ${{ vars.LAMBDA_SECURITY_GROUP_ID }}
      DATABASE_PROXY_ENDPOINT: ${{ vars.DATABASE_PROXY_ENDPOINT }}
      DATABASE_PROXY_RESOURCE_ID: ${{ vars.DATABASE_PROXY_RESOURCE_ID }}
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_IDS: ${{ vars.COGNITO_CLIENT_IDS }}
      WEB_APP_ORIGIN: ${{ vars.WEB_APP_ORIGIN }}
      AI_WRAPPER_ROLE_ARN: ${{ vars.AI_WRAPPER_ROLE_ARN }}
      IDEMPOTENCY_KEYS_SECRET_ARN: ${{ vars.IDEMPOTENCY_KEYS_SECRET_ARN }}
      ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: mincome-backend-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # El paquete ya se probó en CI (npm run test:lambda-bundle).
      - run: npm ci

      - run: sam validate --lint
      - run: sam build
      - name: sam deploy
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "PrivateSubnetIds=$PRIVATE_SUBNET_IDS" \
              "LambdaSecurityGroupId=$LAMBDA_SECURITY_GROUP_ID" \
              "DatabaseProxyEndpoint=$DATABASE_PROXY_ENDPOINT" \
              "DatabaseProxyResourceId=$DATABASE_PROXY_RESOURCE_ID" \
              "CognitoUserPoolId=$COGNITO_USER_POOL_ID" \
              "CognitoClientIds=$COGNITO_CLIENT_IDS" \
              "WebAppOrigin=$WEB_APP_ORIGIN" \
              "AiWrapperRoleArn=$AI_WRAPPER_ROLE_ARN" \
              "IdempotencyKeysSecretArn=$IDEMPOTENCY_KEYS_SECRET_ARN" \
              "AlarmEmail=$ALARM_EMAIL"

      # En los despliegues siguientes las corre el hook PreTraffic antes de
      # mover el alias; el primero crea el alias sin pasar por CodeDeploy.
      # Repetirlas no hace nada si ya están aplicadas.
      - name: Migraciones
        run: |
          function_name=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='BackendFunctionName'].OutputValue" --output text)
          aws lambda invoke --function-name "$function_name:live" \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 90 \
            --payload '{"job": "migrate"}' migrate-result.json > invoke-meta.json
          cat migrate-result.json; echo
          if grep -q FunctionError invoke-meta.json; then exit 1; fi

      - name: Smoke test
        run: |
          api_url=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          curl --fail --silent --show-error --retry 3 "$api_url/health"
