AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  mincome-backend: NestJS API on Lambda behind an API Gateway HTTP API, the
  Cognito Post confirmation trigger and the daily job. See docs/despliegue.md.

# Los parámetros de red y base salen de `terraform output` (terraform/README.md).
Parameters:
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets in at least two AZs (terraform output private_subnet_ids).
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group that only reaches the RDS Proxy (terraform output backend_lambda_security_group_id).
  DatabaseProxyEndpoint:
    Type: String
    Description: RDS Proxy endpoint (terraform output database_proxy_endpoint).
  DatabaseProxyResourceId:
    Type: String
    AllowedPattern: ^prx-[0-9a-z]+$
    Description: RDS Proxy resource id for rds-db:connect (terraform output database_proxy_resource_id).
  DatabaseName:
    Type: String
    Default: mincome
  DatabaseUser:
    Type: String
    Default: mincome_app
    Description: PostgreSQL user the Lambda connects as with an IAM token (terraform output database_app_username).
  CognitoUserPoolId:
    Type: String
    AllowedPattern: ^[a-z]{2}(-[a-z]+)+-\d_[0-9A-Za-z]+$
  CognitoClientIds:
    Type: CommaDelimitedList
    Description: App client ids of the web and mobile apps (JWT audience).
  WebAppOrigin:
    Type: String
    AllowedPattern: ^https://[^/]+$
    Description: Origin of the web app, e.g. https://app.example.com. The Capacitor origins (capacitor://localhost, https://localhost) are always allowed.
  AiWrapperRoleArn:
    Type: String
    Default: ""
    Description: IAM role of the mincome-ai-wrapper Lambda, the only caller allowed on /internal/*. Empty keeps them closed.
  IdempotencyKeysSecretArn:
    Type: String
    Description: Secrets Manager secret whose plain-text value is IDEMPOTENCY_ENCRYPTION_KEYS (one or more 32+ character keys, comma separated, newest first).
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Cap on concurrent instances to protect the database. 0 reserves nothing (new accounts only have 10 in total).
  ApiThrottlingRateLimit:
    Type: Number
    Default: 50
    Description: Steady requests per second across the API.
  ApiThrottlingBurstLimit:
    Type: Number
    Default: 100
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]
  AlarmEmail:
    Type: String
    Default: ""
    Description: Address that receives the alarms. Empty creates the alarms without notifications.

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  # ---------------------------------------------------------------- Lambda
  BackendFunction:
    Type: AWS::Serverless::Function
    Metadata:
      # Makefile: nest build + esbuild. Solo sube lambda.js, su source map y
      # las licencias (~2 MB en zip), no node_modules.
      BuildMethod: makefile
    Properties:
      Description: mincome-backend API, Cognito trigger and jobs
      CodeUri: .
      Handler: lambda.handler
      Runtime: nodejs24.x
      Architectures: [arm64]
      MemorySize: 1024
      # API Gateway corta a los 30 s; el margen es para {"job": "daily"}.
      Timeout: 60
      # Versión publicada y alias `live` en cada despliegue: API Gateway,
      # Cognito y Scheduler apuntan al alias, y regresar a la versión anterior
      # es mover el alias.
      AutoPublishAlias: live
      # Antes de mover el alias, MigrationsHookFunction corre las migraciones
      # con la versión nueva. Si fallan, o si las alarmas suenan durante el
      # despliegue, CodeDeploy regresa el alias a la versión anterior.
      DeploymentPreference:
        Type: AllAtOnce
        Hooks:
          PreTraffic: !Ref MigrationsHookFunction
        Alarms:
          - !Ref BackendErrorsAlarm
          - !Ref Api5xxAlarm
      Tracing: Active
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
      LoggingConfig:
        # Texto: la app ya escribe una línea JSON por log (Logs Insights la
        # lee) y el filtro por nivel del formato JSON no entiende los niveles
        # de Nest.
        LogFormat: Text
        LogGroup: !Ref BackendLogGroup
      Environment:
        Variables:
          NODE_ENV: production
          NODE_OPTIONS: --enable-source-maps
          AUTH_MODE: api-gateway
          DB_HOST: !Ref DatabaseProxyEndpoint
          DB_NAME: !Ref DatabaseName
          DB_USER: !Ref DatabaseUser
          DB_IAM_AUTH: "true"
          DB_SSL: "true"
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_IDS: !Join [",", !Ref CognitoClientIds]
          CORS_ORIGINS: !Join [",", [!Ref WebAppOrigin, "capacitor://localhost", "https://localhost"]]
          INTERNAL_CALLER_ROLE_ARNS: !Ref AiWrapperRoleArn
          # Se resuelve al desplegar; queda cifrada con KMS en la
          # configuración de la Lambda. Leerla en tiempo de ejecución
          # necesitaría un VPC endpoint de Secrets Manager (no hay NAT).
          IDEMPOTENCY_ENCRYPTION_KEYS: !Sub "{{resolve:secretsmanager:${IdempotencyKeysSecretArn}}}"
      Policies:
        # Lo único que la Lambda puede hacer en AWS además de lo de VPC, logs
        # y X-Ray que agrega SAM: conectarse al proxy como DatabaseUser.
        - Statement:
            - Sid: ConnectToRdsProxyWithIamToken
              Effect: Allow
              Action: rds-db:connect
              Resource: !Sub arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DatabaseProxyResourceId}/${DatabaseUser}
      Events:
        # Un método por ruta, no ANY: así el preflight de CORS (OPTIONS) lo
        # contesta API Gateway sin pasar por el autorizador ni por la Lambda.
        ApiGet:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/api/v1/{proxy+}", Method: GET, PayloadFormatVersion: "2.0" }
        ApiPost:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/api/v1/{proxy+}", Method: POST, PayloadFormatVersion: "2.0" }
        ApiPut:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/api/v1/{proxy+}", Method: PUT, PayloadFormatVersion: "2.0" }
        ApiPatch:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/api/v1/{proxy+}", Method: PATCH, PayloadFormatVersion: "2.0" }
        ApiDelete:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/api/v1/{proxy+}", Method: DELETE, PayloadFormatVersion: "2.0" }
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/health
            Method: GET
            PayloadFormatVersion: "2.0"
            Auth: { Authorizer: NONE }
        # Solo mincome-ai-wrapper, firmando con IAM (contrato §3.8). La Lambda
        # además revisa que el rol sea AiWrapperRoleArn.
        InternalPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/api/v1/internal/{proxy+}"
            Method: POST
            PayloadFormatVersion: "2.0"
            Auth: { Authorizer: AWS_IAM }
        InternalPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/api/v1/internal/{proxy+}"
            Method: PATCH
            PayloadFormatVersion: "2.0"
            Auth: { Authorizer: AWS_IAM }
        # Recurrentes y limpieza de llaves de idempotencia (§3.7), poco
        # después de medianoche en la zona por omisión de los usuarios.
        DailyJob:
          Type: ScheduleV2
          Properties:
            Description: mincome-backend daily job
            ScheduleExpression: cron(15 0 * * ? *)
            ScheduleExpressionTimezone: America/Mexico_City
            FlexibleTimeWindow: { Mode: "OFF" }
            Input: '{"job": "daily"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600
            # Si los reintentos fallan, el evento queda en una cola SQS y la
            # alarma DailyJobFailedAlarm avisa.
            DeadLetterConfig:
              Type: SQS

  # Hook PreTraffic de CodeDeploy. El nombre debe empezar con CodeDeployHook_:
  # es lo único que el rol de CodeDeploy que crea SAM puede invocar. Fuera de
  # la VPC: solo habla con las APIs de Lambda y CodeDeploy.
  MigrationsHookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub CodeDeployHook_${AWS::StackName}-migrations
      Description: Runs the migrations with the new backend version before it gets traffic
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref MigrationsHookLogGroup
      Environment:
        Variables:
          NEW_VERSION_ARN: !Ref BackendFunction.Version
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Ref BackendFunction.Version
            - Effect: Allow
              Action: codedeploy:PutLifecycleEventHookExecutionStatus
              Resource: !Sub arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${ServerlessDeploymentApplication}/*
      # El SDK v3 viene en el runtime de Node.js de Lambda.
      InlineCode: |
        const { LambdaClient, InvokeCommand } = require('@aws-sdk/client-lambda');
        const {
          CodeDeployClient,
          PutLifecycleEventHookExecutionStatusCommand,
        } = require('@aws-sdk/client-codedeploy');

        const lambda = new LambdaClient({});
        const codeDeploy = new CodeDeployClient({});

        exports.handler = async (event) => {
          let status = 'Failed';
          try {
            const result = await lambda.send(
              new InvokeCommand({
                FunctionName: process.env.NEW_VERSION_ARN,
                Payload: JSON.stringify({ job: 'migrate' }),
              }),
            );
            const response = Buffer.from(result.Payload ?? []).toString('utf8');
            console.log(JSON.stringify({ functionError: result.FunctionError ?? null, response }));
            if (!result.FunctionError) {
              status = 'Succeeded';
            }
          } catch (error) {
            console.error(error);
          }
          await codeDeploy.send(
            new PutLifecycleEventHookExecutionStatusCommand({
              deploymentId: event.DeploymentId,
              lifecycleEventHookExecutionId: event.LifecycleEventHookExecutionId,
              status,
            }),
          );
        };

  MigrationsHookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-migrations-hook
      RetentionInDays: !Ref LogRetentionDays

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-backend
      RetentionInDays: !Ref LogRetentionDays

  # El trigger se configura en el user pool (LambdaConfig.PostConfirmation)
  # con la salida BackendFunctionAliasArn; esto solo deja a ese pool invocarla.
  CognitoPostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BackendFunction.Alias
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub
        - arn:${AWS::Partition}:cognito-idp:${PoolRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
        - PoolRegion: !Select [0, !Split ["_", !Ref CognitoUserPoolId]]

  # ----------------------------------------------------------- API Gateway
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: Mincome API
      FailOnWarnings: true
      CorsConfiguration:
        # Una lista literal: si AllowOrigins fuera un !Ref, SAM tomaría todo
        # el bloque como intrínseca y perdería headers, métodos y MaxAge.
        AllowOrigins: [!Ref WebAppOrigin, "capacitor://localhost", "https://localhost"]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE]
        AllowHeaders: [authorization, content-type, idempotency-key]
        ExposeHeaders: [idempotent-replayed, retry-after]
        MaxAge: 600
      Auth:
        # Toda ruta pide el JWT de Cognito salvo las que digan otra cosa.
        DefaultAuthorizer: CognitoJwt
        EnableIamAuthorizer: true
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub
                - https://cognito-idp.${PoolRegion}.amazonaws.com/${CognitoUserPoolId}
                - PoolRegion: !Select [0, !Split ["_", !Ref CognitoUserPoolId]]
              audience: !Ref CognitoClientIds
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ApiThrottlingBurstLimit
      # Sin datos personales: ni correo ni claims, solo el request y su
      # resultado.
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "time":"$context.requestTime","routeKey":"$context.routeKey",
          "status":"$context.status","latencyMs":"$context.responseLatency",
          "integrationLatencyMs":"$context.integrationLatency",
          "responseLength":"$context.responseLength",
          "authorizerError":"$context.authorizer.error",
          "integrationError":"$context.integrationErrorMessage"}

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-access
      RetentionInDays: !Ref LogRetentionDays

  # ---------------------------------------------------------------- Alarmas
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  BackendErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The backend Lambda threw errors (unhandled, timeouts or out of memory).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BackendFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  BackendThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The backend Lambda ran out of concurrency.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref BackendFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API answered 5xx (internal_error, Lambda failures or timeouts).
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DailyJobFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The daily job failed after its retries and its event is in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt BackendFunctionDailyJobQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ApiUrl:
    Description: Base URL of the API (VITE_API_URL in the front).
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/v1
  HttpApiId:
    Description: For mincome-ai-wrapper to add its POST /chat route to the same API.
    Value: !Ref HttpApi
    Export:
      Name: !Sub ${AWS::StackName}-HttpApiId
  BackendFunctionName:
    Description: Function to invoke with {"job":"migrate"} on the first deploy (later ones run them in the PreTraffic hook).
    Value: !Ref BackendFunction
  BackendFunctionAliasArn:
    Description: Set it as the user pool's Post confirmation trigger.
    Value: !Ref BackendFunction.Alias
